name: Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftp-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ivoirQuizz/package-lock.json

      - name: Install production PHP dependencies
        run: composer install --working-dir=ivoirQuizz --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Install frontend dependencies and build assets
        run: npm ci --prefix ivoirQuizz && npm run build --prefix ivoirQuizz

      - name: Assemble release package
        shell: bash
        run: |
          mkdir -p release
          rsync -a \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='!.env.example' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/framework/testing/*' \
            --exclude='database/*.sqlite' \
            --exclude='database/*.sqlite-*' \
            --exclude='.phpunit.result.cache' \
            ivoirQuizz/ release/
          test -f release/vendor/autoload.php
          test -f release/public/build/manifest.json
          test ! -e release/.env

      - name: Check FTP configuration
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions secret or variable: ${name}"
              exit 1
            fi
          done
          if [[ "$FTP_SERVER_DIR" != */ ]]; then
            FTP_SERVER_DIR="${FTP_SERVER_DIR}/"
          fi
          echo "FTP_SERVER_DIR=${FTP_SERVER_DIR}" >> "$GITHUB_ENV"

      - name: Deploy over explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ env.FTP_SERVER_DIR }}
          local-dir: ./release/
          state-name: ../.ftp-deploy-sync-state.json
          dangerous-clean-slate: false
